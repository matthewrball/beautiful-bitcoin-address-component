  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --color-text-primary: #181d27;
      --color-text-secondary: #414651;
      --color-text-tertiary: #535862;
      --color-border: #d5d7da;
      --color-bg-primary: #f3f4f6;
      --color-bg-secondary: #ffffff;
      --color-bg-hover: #f9fafb;
      --color-toast-bg: #1f2937;
      --shadow-xs: 0 1px 2px rgba(10, 13, 18, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius-sm: 8px;
      --radius-lg: 16px;
    }

    .dark {
      --color-text-primary: #f5f5f6;
      --color-text-secondary: #cecfd2;
      --color-text-tertiary: #94969c;
      --color-border: #333741;
      --color-bg-primary: #0c111d;
      --color-bg-secondary: #161b26;
      --color-bg-hover: #1f242f;
      --color-toast-bg: #374151;
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      transition: background-color 300ms ease;
      -webkit-overflow-scrolling: touch;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 512px;
      width: 100%;
    }

    .section { display: flex; flex-direction: column; gap: 12px; width: 100%; }

    .section__heading {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-tertiary);
      line-height: 20px;
      transition: color 300ms ease;
    }

    .card {
      background-color: var(--color-bg-secondary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 48px;
      transition: background-color 300ms ease, box-shadow 300ms ease;
    }

    .back-link {
      position: fixed;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-xs);
      text-decoration: none;
      transition: background-color 150ms ease-out;
    }

    .back-link:hover { background-color: var(--color-bg-hover); }
    .back-link__icon { width: 16px; height: 16px; color: var(--color-text-tertiary); flex-shrink: 0; }
    .back-link__text { font-size: 14px; font-weight: 500; color: var(--color-text-secondary); line-height: 20px; transition: color 300ms ease; }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 12px;
      border-radius: var(--radius-sm);
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-xs);
      cursor: pointer;
      transition: background-color 150ms ease-out;
    }

    .theme-toggle:hover { background-color: var(--color-bg-hover); }
    .theme-toggle__icon { width: 20px; height: 20px; color: var(--color-text-secondary); display: block; }
    .theme-toggle__icon--sun { display: none; }
    .dark .theme-toggle__icon--sun { display: block; }
    .dark .theme-toggle__icon--moon { display: none; }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--color-toast-bg);
      color: white;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms ease;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      margin-top: -8px;
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-xs);
      text-decoration: none;
      transition: background-color 150ms ease-out;
    }

    .github-link:hover { background-color: var(--color-bg-hover); }
    .github-link__icon { width: 18px; height: 18px; color: var(--color-text-secondary); flex-shrink: 0; }
    .github-link__text { font-size: 14px; font-weight: 500; color: var(--color-text-secondary); line-height: 20px; }

    .footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      color: var(--color-text-tertiary);
      line-height: 20px;
      transition: color 300ms ease;
    }

    .footer__link { color: var(--color-text-secondary); text-decoration: none; transition: color 150ms ease; }
    .footer__link:hover { color: var(--color-text-primary); text-decoration: underline; }

    bitcoin-address {
      --btc-font-mono: 'Source Code Pro', ui-monospace, monospace;
    }

    @media (max-width: 480px) {
      body { padding: 16px; padding-top: 72px; padding-bottom: 72px; }
      .card { padding: 24px; border-radius: 12px; overflow: hidden; }
      .page-wrapper { gap: 20px; }
      .section { gap: 8px; }
      .theme-toggle { top: 12px; right: 12px; padding: 10px; }
      .theme-toggle__icon { width: 18px; height: 18px; }
      .back-link { top: 12px; left: 12px; padding: 10px; gap: 4px; }
      .back-link__icon { width: 14px; height: 14px; }
      .back-link__text { font-size: 12px; }
      .toast { bottom: 70px; font-size: 14px; padding: 8px 12px; left: 16px; right: 16px; transform: none; text-align: center; }
      .github-link { padding: 6px 8px; }
      .github-link__icon { width: 16px; height: 16px; }
      .github-link__text { font-size: 12px; }
      .footer { bottom: 12px; font-size: 12px; padding: 0 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <a href="https://matthewball.me" class="back-link">
    <svg class="back-link__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    <span class="back-link__text">Back to matthewball.me</span>
  </a>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <svg class="theme-toggle__icon theme-toggle__icon--sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
    <svg class="theme-toggle__icon theme-toggle__icon--moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
  </button>

  <main class="page-wrapper">
    <section class="section">
      <h2 class="section__heading">Native SegWit (Bech32) P2WSH</h2>
      <div class="card">
        <bitcoin-address address="bc1qvhu3557twysq2ldn6dut6rmaj3qk04p60h9l79wk4lzgy0ca8mfsnffz65"></bitcoin-address>
      </div>
    </section>

    <section class="section">
      <h2 class="section__heading">Wrapped Segwit (P2SH-P2WSH)</h2>
      <div class="card">
        <bitcoin-address address="3HU3JVMSGushfkoWS9eyZjGzGQK5dD1zob"></bitcoin-address>
      </div>
    </section>

    <a href="https://github.com/matthewrball/beautiful-bitcoin-address-component" class="github-link" target="_blank" rel="noopener noreferrer">
      <svg class="github-link__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      <span class="github-link__text">View on GitHub</span>
    </a>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Address copied to clipboard!</div>

  <footer class="footer">
    Designed by Matthew Ball on <a href="https://mempool.space/block/0000000000000000000032bcfdb9b513ff18a9458de954e692bfb639047d51b2" class="footer__link" target="_blank" rel="noopener noreferrer">933412</a>
  </footer>

  <script src="bitcoin-address.js"></script>
  <script>
    (function() {
      var THEME_KEY = 'btc-address-theme';
      if (localStorage.getItem(THEME_KEY) === 'dark') document.documentElement.classList.add('dark');

      document.getElementById('themeToggle').addEventListener('click', function() {
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      });

      var toast = document.getElementById('toast');
      document.querySelectorAll('bitcoin-address').forEach(function(el) {
        el.addEventListener('bitcoin-address:copy', function(e) {
          if (!e.detail.success) return;
          toast.style.opacity = '1';
          setTimeout(function() { toast.style.opacity = '0'; }, 2000);
        });
      });
    })();
  </script>
</body>
</html>
